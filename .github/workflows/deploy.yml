name: Deploy server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and test server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build NestJS app
        run: npm run build

  package:
    name: Publish Docker images to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_APP=ghcr.io/$OWNER/homebase-server-app" >> $GITHUB_ENV
          echo "IMAGE_MIGRATOR=ghcr.io/$OWNER/homebase-server-migrator" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATOR }}:${{ github.sha }}
            ${{ env.IMAGE_MIGRATOR }}:latest
  deploy:
    name: Deploy to EC2
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.APP_DIR }}"
            REPO_URL="${{ secrets.APP_REPO_URL }}"
            GHCR_OWNER="${{ github.repository_owner }}"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }}" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            cat > .env <<'EOF'
            ${{ secrets.SERVER_ENV }}
            EOF

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

            export HOMEBASE_APP_IMAGE="ghcr.io/$GHCR_OWNER/homebase-server-app:latest"
            export HOMEBASE_MIGRATOR_IMAGE="ghcr.io/$GHCR_OWNER/homebase-server-migrator:latest"

            docker compose pull
            docker compose down --remove-orphans || true
            docker compose up -d
            docker compose ps
